version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memoai-postgres
    restart: always
    environment:
      POSTGRES_DB: memoai_db
      POSTGRES_USER: memoai_user
      POSTGRES_PASSWORD: memoai_secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoai_user -d memoai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memoai-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: memoai_user
      DB_PASS: memoai_secure_password_123
      DB_NAME: memoai_db
      JWT_SECRET: memoai_jwt_production_secret_key_987654321
      JWT_EXPIRATION: 7d
      AI_PROVIDER: mock
      GEMINI_API_KEY: ""
      FRONTEND_URL: http://localhost:8080
    volumes:
      - backend_uploads:/app/uploads
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memoai-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_storage:
